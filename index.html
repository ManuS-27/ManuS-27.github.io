<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portafolio Profesional</title>
    <style>
        /* Centra el portafolio y limpia los bordes */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff; /* Si tu diseño tiene otro fondo, puedes cambiar el #ffffff */
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Hace que ambas imágenes se adapten perfectamente a celulares y pantallas */
        img {
            max-width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Primera pantalla -->
    <img src="portafolio1.png" alt="Portafolio Parte 1">

    <!-- Segunda pantalla -->
    <img src="portafolio2.png" alt="Portafolio Parte 2">

</body>
</html>
